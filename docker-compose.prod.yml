# Production stack for self-hosting behind Cloudflare Tunnel (no open router ports).
# Start it with startserver.bat (scripts/start-production.ps1); stop it with stopserver.bat.
# Secrets come from .env.production, which is never committed (template: .env.production.example).
# Separate project name and volume from the development stack in docker-compose.yml.
name: xuye-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xuye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: xuye
    # No published port: only migrate and app reach the database, on the compose network.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xuye -d xuye"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://xuye:${POSTGRES_PASSWORD}@db:5432/xuye
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://xuye:${POSTGRES_PASSWORD}@db:5432/xuye
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.production}
      VISITOR_ID_SECRET: ${VISITOR_ID_SECRET:?set VISITOR_ID_SECRET in .env.production}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env.production}
      # Launch sign-in is Google only; no mail provider (see docs/DECISIONS.md, "Launch sign-in").
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    # Loopback only, for local checks; the public path is the tunnel. 3080 avoids `pnpm dev` on 3000.
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Enabled with `--profile tunnel` once CLOUDFLARE_TUNNEL_TOKEN is set. In Cloudflare Zero Trust,
  # the tunnel's public hostname xuye.chaoanstudio.com points at http://app:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Not `:?`: `down`/`ps` with the profile must work before a token exists.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
