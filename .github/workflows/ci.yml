name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xuye
          POSTGRES_PASSWORD: xuye
          POSTGRES_DB: xuye
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xuye -d xuye"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://xuye:xuye@localhost:5432/xuye
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_URL: http://localhost:3100
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: 續頁 <no-reply@xuye.localhost>
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The E2E database (xuye_e2e) is created and migrated by `pnpm e2e:prepare`.
      - run: pnpm build
      # `pnpm start` runs the standalone server, the same artifact the Docker image ships.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target runner -t xuye:ci .
      - run: docker build --target migrator -t xuye-migrate:ci .
